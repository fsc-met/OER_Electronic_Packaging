 font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" fill="#183A63">test points</text><rect x="80" y="80" width="700" height="235" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="80" y="80" width="700" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="80" y="132" width="700" height="20" fill="#EAF3F8" stroke="none"/><text x="108" y="132" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Shield / cover</text><text x="108" y="198" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="108" dy="0">Later mechanical installation</tspan><tspan x="108" dy="42.48">Clip / fastened cover; not reflow-soldered</tspan></text><line x1="760" y1="235" x2="980" y2="555" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><rect x="1920" y="80" width="1100" height="245" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="1920" y="80" width="1100" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="1920" y="132" width="1100" height="20" fill="#EAF3F8" stroke="none"/><text x="1948" y="132" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Daughterboard / module</text><text x="1948" y="198" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="1948" dy="0">Mates to a defined connector</tspan><tspan x="1948" dy="42.48">Mechanical support is separate from</tspan><tspan x="1948" dy="42.48">the electrical interface</tspan></text><line x1="2100" y1="315" x2="1980" y2="485" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><rect x="2440" y="460" width="580" height="300" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="2440" y="460" width="580" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="2440" y="512" width="580" height="20" fill="#EAF3F8" stroke="none"/><text x="2468" y="512" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Bracket + fastener</text><text x="2468" y="578" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="2468" dy="0">Bracket + standoff + screw</tspan><tspan x="2468" dy="42.48">create a physical support/load path</tspan></text><line x1="2440" y1="650" x2="2255" y2="845" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><rect x="2230" y="1090" width="790" height="560" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="2230" y="1090" width="790" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="2230" y="1142" width="790" height="20" fill="#EAF3F8" stroke="none"/><text x="2258" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Heat sink + TIM</text><text x="2258" y="1208" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="2258" dy="0">Heat sink contacts the device through</tspan><tspan x="2258" dy="42.48">a thin thermal interface layer (TIM)</tspan></text><line x1="2230" y1="1270" x2="2035" y2="940" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><text x="2610" y="1395" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" fill="#183A63">Interface stack</text><rect x="2470" y="1430" width="300" height="70" rx="6" fill="#AAB4BC" stroke="#69767F" stroke-width="3"/><text x="2620" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#22313F">Heat sink</text><rect x="2470" y="1505" width="300" height="22" rx="4" fill="#79B8C8" stroke="#4E8CA0" stroke-width="2"/><text x="2810" y="1524" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#183A63">TIM layer</text><rect x="2470" y="1532" width="300" height="70" rx="6" fill="#53616B" stroke="#3D4A52" stroke-width="3"/><text x="2620" y="1577" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Device</text><rect x="80" y="1280" width="720" height="300" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="80" y="1280" width="720" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="80" y="1332" width="720" height="20" fill="#EAF3F8" stroke="none"/><text x="108" y="1332" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Identification label</text><text x="108" y="1398" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="108" dy="0">Place on an unobstructed surface</tspan><tspan x="108" dy="42.48">Do not cover test points, connectors,</tspan><tspan x="108" dy="42.48">or required fasteners</tspan></text><line x1="800" y1="1410" x2="1100" y2="1145" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="570" width="720" height="310" rx="20" fill="#ffffff" stroke="#9CBBD0" stroke-width="3"/><rect x="80" y="570" width="720" height="72" rx="20" fill="#EAF3F8" stroke="none"/><rect x="80" y="622" width="720" height="20" fill="#EAF3F8" stroke="none"/><text x="108" y="622" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#183A63">Localized staking / adhesive</text><text x="108" y="688" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="normal" text-anchor="start" fill="#22313F"><tspan x="108" dy="0">Use only where local support is needed</tspan><tspan x="108" dy="42.48">Keep test points and connectors clear</tspan></text><line x1="800" y1="750" x2="1010" y2="935" stroke="#2E77BB" stroke-width="5" marker-end="url(#arrow)"/><rect x="860" y="1450" width="1320" height="235" rx="22" fill="#EEF7F0" stroke="#A8CBB1" stroke-width="3"/><text x="1520" y="1530" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#4E8B62">Preserve access, alignment, and support</text><text x="1520" y="1590" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="normal" text-anchor="middle" fill="#22313F"><tspan x="1520" dy="0">Keep test points, connectors, and fasteners accessible.</tspan><tspan x="1520" dy="48.1">Added hardware should not load or interfere with nearby components.</tspan></text></svg>