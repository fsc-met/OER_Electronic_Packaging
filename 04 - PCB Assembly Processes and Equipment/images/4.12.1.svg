<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1300" viewBox="0 0 2240 1300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#596a78"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#c47b2a"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#20364f; font-size:36px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill:#405364; font-size:29px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill:#536575; font-size:25px; }
      .bold { font-weight:700; }
      .panel { fill:#f7fafc; stroke:#bfd0dc; stroke-width:4; }
      .pcb { fill:#83b78b; stroke:#477d56; stroke-width:5; }
      .pad { fill:#d7b94d; stroke:#957927; stroke-width:2; }
      .comp { fill:#4d5963; stroke:#2e3942; stroke-width:4; }
      .endcap { fill:#c7cfd5; stroke:#6b7883; stroke-width:3; }
      .axis { fill:none; stroke:#2f6f9f; stroke-width:7; marker-end:url(#arrow-blue); }
      .leader { fill:none; stroke:#596a78; stroke-width:4; marker-end:url(#arrow-gray); }
      .rot { fill:none; stroke:#c47b2a; stroke-width:7; marker-end:url(#arrow-amber); }
      .guide { fill:none; stroke:#6f8291; stroke-width:3; stroke-dasharray:9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="2240" height="1300" fill="#ffffff"/>

  <!-- Main panel -->
  <rect x="70" y="70" width="1450" height="1140" rx="28" class="panel"/>
  <text x="120" y="125" class="label bold">Top side — example placement coordinate frame</text>
  <text x="120" y="164" class="small">Origin location and rotation convention are workflow-defined</text>

  <!-- Board -->
  <rect x="260" y="270" width="1050" height="675" rx="22" class="pcb"/>
  <text x="785" y="235" text-anchor="middle" class="small">Simplified PCB, top view</text>

  <!-- component pads -->
  <g>
    <rect x="492" y="755" width="35" height="22" rx="4" class="pad"/>
    <rect x="548" y="755" width="35" height="22" rx="4" class="pad"/>
    <rect x="563" y="733" width="22" height="35" rx="4" class="pad"/>
    <rect x="563" y="788" width="22" height="35" rx="4" class="pad"/>
    <g transform="translate(872,550)">
      <rect x="-100" y="-86" width="32" height="20" rx="3" class="pad"/>
      <rect x="-100" y="-38" width="32" height="20" rx="3" class="pad"/>
      <rect x="-100" y="10" width="32" height="20" rx="3" class="pad"/>
      <rect x="-100" y="58" width="32" height="20" rx="3" class="pad"/>
      <rect x="68" y="-86" width="32" height="20" rx="3" class="pad"/>
      <rect x="68" y="-38" width="32" height="20" rx="3" class="pad"/>
      <rect x="68" y="10" width="32" height="20" rx="3" class="pad"/>
      <rect x="68" y="58" width="32" height="20" rx="3" class="pad"/>
    </g>
  </g>

  <!-- R12 0 deg -->
  <g>
    <rect x="510" y="745" width="55" height="40" rx="8" class="comp"/>
    <rect x="497" y="751" width="13" height="28" class="endcap"/>
    <rect x="565" y="751" width="13" height="28" class="endcap"/>
    <circle cx="537.5" cy="765" r="7" fill="#ffffff" stroke="#20364f" stroke-width="3"/>
    <text x="440" y="725" class="label bold">R12</text>
    <text x="445" y="810" class="small">0°</text>
  </g>

  <!-- C7 90 deg -->
  <g>
    <rect x="572" y="735" width="40" height="60" rx="8" class="comp"/>
    <rect x="578" y="722" width="28" height="13" class="endcap"/>
    <rect x="578" y="795" width="28" height="13" class="endcap"/>
    <circle cx="592.25" cy="765" r="7" fill="#ffffff" stroke="#20364f" stroke-width="3"/>
    <text x="620" y="725" class="label bold">C7</text>
    <text x="625" y="800" class="small">90°</text>
  </g>

  <!-- U3 asymmetric SOIC at 180 deg -->
  <g>
    <rect x="790" y="480" width="164" height="140" rx="18" class="comp"/>
    <!-- notch now at bottom to show 180° relative to a 0°-at-top library reference -->
    <path d="M846 620 Q872 590 898 620" fill="#ffffff" stroke="#c47b2a" stroke-width="5"/>
    <!-- pin-1/reference dot at lower right after 180° rotation -->
    <circle cx="932" cy="599" r="10" fill="#f4c66b" stroke="#8b632d" stroke-width="3"/>
    <!-- placement origin -->
    <circle cx="872" cy="550" r="8" fill="#ffffff" stroke="#20364f" stroke-width="3"/>
    <line x1="850" y1="550" x2="894" y2="550" stroke="#20364f" stroke-width="3"/>
    <line x1="872" y1="528" x2="872" y2="572" stroke="#20364f" stroke-width="3"/>
    <text x="872" y="455" text-anchor="middle" class="label bold">U3</text>
    <text x="872" y="660" text-anchor="middle" class="small">180°</text>
    <path d="M1000 495 A150 125 0 0 1 1008 610" class="rot"/>
  </g>

  <!-- U3 technical callouts kept separate -->
  <text x="1060" y="475" class="small">pin-1 / orientation reference</text>
  <path d="M1080 487 L946 592" class="leader"/>
  <text x="1075" y="635" class="small">component placement origin</text>
  <path d="M1095 648 L888 563" class="leader"/>
  <text x="1028" y="555" class="tiny">rotation about origin</text>

  <!-- R12 coordinate example -->
  <path d="M537.5 765 L537.5 900" class="guide"/>
  <path d="M537.5 765 L300 765" class="guide"/>
  <rect x="690" y="735" width="520" height="132" rx="18" fill="#eef4f8" stroke="#b7cbd9" stroke-width="3"/>
  <text x="720" y="778" class="label bold">R12 placement-data example</text>
  <text x="720" y="820" class="small">X = 18.50 mm   Y = 12.00 mm</text>
  <text x="720" y="855" class="small">rotation = 0°   side = Top</text>

  <!-- Board placement origin and axes -->
  <circle cx="260" cy="945" r="13" fill="#ffffff" stroke="#20364f" stroke-width="5"/>
  <line x1="260" y1="945" x2="1230" y2="945" class="axis"/>
  <line x1="260" y1="945" x2="260" y2="305" class="axis"/>
  <text x="1255" y="957" class="label bold">X</text>
  <text x="240" y="290" class="label bold">Y</text>
  <text x="120" y="1002" class="label bold">Board coordinate origin O</text>
  <text x="120" y="1042" class="small">example datum — workflow-defined</text>
  <path d="M365 992 L277 953" class="leader"/>
  <text x="1100" y="1140" class="tiny">example coordinates shown proportionally; units: mm</text>

  <!-- Bottom-side convention inset -->
  <rect x="1580" y="220" width="580" height="790" rx="28" fill="#f1f5f8" stroke="#bdceda" stroke-width="4"/>
  <text x="1870" y="282" text-anchor="middle" class="label bold">Bottom side</text>
  <text x="1870" y="323" text-anchor="middle" class="small">CAD/export ↔ machine mapping can vary</text>

  <rect x="1645" y="410" width="190" height="215" rx="18" fill="#ffffff" stroke="#8da4b5" stroke-width="3"/>
  <rect x="1905" y="410" width="190" height="215" rx="18" fill="#ffffff" stroke="#8da4b5" stroke-width="3"/>
  <text x="1740" y="390" text-anchor="middle" class="small">CAD / export view</text>
  <text x="2000" y="390" text-anchor="middle" class="small">machine job view</text>

  <rect x="1685" y="458" width="110" height="115" rx="11" fill="#9dc5a4" stroke="#477d56" stroke-width="3"/>
  <rect x="1945" y="458" width="110" height="115" rx="11" fill="#9dc5a4" stroke="#477d56" stroke-width="3"/>
  <path d="M1700 555 L1778 555" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1700 555 L1700 478" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1960 555 L2038 555" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1960 555 L1960 478" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="1722" y="493" width="36" height="49" rx="6" class="comp"/>
  <circle cx="1731" cy="503" r="5" fill="#f4c66b"/>
  <rect x="1982" y="493" width="36" height="49" rx="6" class="comp"/>
  <circle cx="1991" cy="503" r="5" fill="#f4c66b"/>

  <line x1="1845" y1="520" x2="1895" y2="520" stroke="#596a78" stroke-width="6" marker-end="url(#arrow-gray)"/>
  <text x="1870" y="670" text-anchor="middle" class="small">Example workflow mapping</text>
  <text x="1870" y="708" text-anchor="middle" class="tiny">may include view, mirror, or rotation changes</text>

  <rect x="1665" y="760" width="410" height="135" rx="20" fill="#fff6e9" stroke="#ddb980" stroke-width="3"/>
  <text x="1870" y="815" text-anchor="middle" class="label bold">Verify configured convention</text>
  <text x="1870" y="858" text-anchor="middle" class="small">Do not assume one universal rule</text>

  <text x="1870" y="955" text-anchor="middle" class="tiny">Board-side mapping is workflow-dependent</text>
</svg>