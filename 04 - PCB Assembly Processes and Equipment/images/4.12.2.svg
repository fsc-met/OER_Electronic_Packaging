<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1350" viewBox="0 0 2240 1350" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#596a78"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2b8f83"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#20364f; font-size:36px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill:#415364; font-size:29px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill:#536575; font-size:24px; }
      .bold { font-weight:700; }
      .panel { fill:#f8fafc; stroke:#bfd0dc; stroke-width:4; }
      .pcb { fill:#83b78b; stroke:#477d56; stroke-width:5; }
      .prog { fill:none; stroke:#8fa9bb; stroke-width:5; stroke-dasharray:16 12; }
      .fid { fill:#f2d45f; stroke:#475765; stroke-width:4; }
      .fid-open { fill:#ffffff; stroke:#8fa9bb; stroke-width:4; stroke-dasharray:7 6; }
      .target-open { fill:#ffffff; stroke:#667887; stroke-width:4; }
      .target-corr { fill:#ffffff; stroke:#2f6f9f; stroke-width:4; }
      .vision { fill:none; stroke:#2b8f83; stroke-width:5; stroke-dasharray:11 9; }
      .delta { fill:none; stroke:#2f6f9f; stroke-width:6; marker-end:url(#arrow-blue); }
      .leader { fill:none; stroke:#596a78; stroke-width:4; marker-end:url(#arrow-gray); }
      .disp { fill:none; stroke:#8fa9bb; stroke-width:4; stroke-dasharray:9 7; }
    </style>
  </defs>

  <!-- Explicit white background -->
  <rect x="0" y="0" width="2240" height="1350" fill="#ffffff"/>

  <!-- LEFT PANEL -->
  <rect x="70" y="70" width="1190" height="1150" rx="28" class="panel"/>
  <text x="120" y="128" class="label bold">Programmed reference vs. actual PCB</text>
  <text x="120" y="168" class="small">The same board can enter slightly shifted and rotated</text>

  <!-- Programmed reference board -->
  <rect x="250" y="315" width="800" height="510" rx="18" class="prog"/>
  <text x="270" y="287" class="small">Programmed board / reference frame</text>

  <!-- ACTUAL PCB GROUP: translated + rotated -->
  <g transform="translate(42,30) rotate(4 650 570)">
    <rect x="250" y="315" width="800" height="510" rx="18" class="pcb" opacity="0.80"/>
    <!-- same-board internal geometry -->
    <rect x="485" y="445" width="110" height="70" rx="10" fill="#4e5963"/>
    <rect x="755" y="590" width="95" height="60" rx="9" fill="#4e5963"/>
    <rect x="405" y="662" width="75" height="45" rx="8" fill="#4e5963"/>
    <rect x="635" y="395" width="75" height="45" rx="8" fill="#4e5963"/>

    <!-- actual fiducials -->
    <circle cx="325" cy="385" r="19" class="fid"/>
    <circle cx="970" cy="755" r="19" class="fid"/>

    <!-- corrected targets attached to actual board frame -->
    <g class="target-corr">
      <circle cx="525" cy="465" r="19"/>
      <line x1="508" y1="465" x2="542" y2="465" stroke="#2f6f9f" stroke-width="4"/>
      <line x1="525" y1="448" x2="525" y2="482" stroke="#2f6f9f" stroke-width="4"/>
      <circle cx="790" cy="620" r="19"/>
      <line x1="773" y1="620" x2="807" y2="620" stroke="#2f6f9f" stroke-width="4"/>
      <line x1="790" y1="603" x2="790" y2="637" stroke="#2f6f9f" stroke-width="4"/>
    </g>
  </g>

  <!-- Expected fiducials redrawn above actual board for clear correspondence -->
  <circle cx="325" cy="385" r="17" class="fid-open"/>
  <circle cx="970" cy="755" r="17" class="fid-open"/>

  <!-- Programmed target symbols redrawn above actual board -->
  <g>
    <circle cx="525" cy="465" r="18" class="target-open"/>
    <line x1="509" y1="465" x2="541" y2="465" stroke="#667887" stroke-width="3"/>
    <line x1="525" y1="449" x2="525" y2="481" stroke="#667887" stroke-width="3"/>
    <circle cx="790" cy="620" r="18" class="target-open"/>
    <line x1="774" y1="620" x2="806" y2="620" stroke="#667887" stroke-width="3"/>
    <line x1="790" y1="604" x2="790" y2="636" stroke="#667887" stroke-width="3"/>
  </g>
  <text x="455" y="430" class="tiny">programmed target</text>

  <!-- Correspondence leaders: programmed fiducial to actual fiducial positions -->
  <line x1="325" y1="385" x2="378" y2="392" class="disp"/>
  <line x1="970" y1="755" x2="995" y2="804" class="disp"/>

  <!-- Translation and rotation cues -->
  <text x="112" y="760" class="small">board translation</text>
  <line x1="170" y1="875" x2="255" y2="875" class="delta"/>
  <text x="188" y="849" class="small">ΔX</text>
  <line x1="170" y1="875" x2="170" y2="795" class="delta"/>
  <text x="120" y="824" class="small">ΔY</text>

  <path d="M1030 265 A115 95 0 0 1 1105 350" fill="none" stroke="#2f6f9f" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="1070" y="260" class="small">Δθ</text>

  <text x="875" y="900" class="label bold">Actual PCB</text>
  <path d="M875 875 L920 820" class="leader"/>

  <!-- Board camera -->
  <rect x="105" y="955" width="130" height="98" rx="18" fill="#2b8f83" stroke="#236d65" stroke-width="4"/>
  <circle cx="170" cy="993" r="25" fill="#d9ffff" stroke="#236d65" stroke-width="3"/>
  <text x="265" y="980" class="label bold">Board-recognition camera</text>
  <text x="265" y="1019" class="small">detects the actual board fiducials</text>

  <!-- Sight lines terminate on actual fiducials -->
  <line x1="215" y1="955" x2="378" y2="392" class="vision"/>
  <line x1="230" y1="975" x2="995" y2="804" class="vision"/>

  <text x="265" y="1088" class="small">Two separated board fiducials shown as a common example</text>
  <text x="265" y="1126" class="tiny">exact count and correction model depend on equipment and process</text>

  <!-- Compact fiducial key; target symbols are explained in the corrected-target panel -->
  <rect x="650" y="1138" width="500" height="62" rx="16" fill="#ffffff" stroke="#c6d4de" stroke-width="3"/>
  <circle cx="690" cy="1169" r="10" class="fid-open"/>
  <text x="713" y="1177" class="tiny">programmed fiducial</text>
  <circle cx="970" cy="1169" r="10" class="fid"/>
  <text x="993" y="1177" class="tiny">actual fiducial</text>

  <!-- RIGHT TOP PANEL -->
  <rect x="1320" y="70" width="850" height="720" rx="28" class="panel"/>
  <text x="1370" y="128" class="label bold">Corrected placement targets</text>
  <text x="1370" y="168" class="small">Board transform moves the targets with the measured PCB</text>

  <rect x="1415" y="212" width="655" height="62" rx="18" fill="#eef4f8" stroke="#b7cbd9" stroke-width="3"/>
  <text x="1742" y="253" text-anchor="middle" class="small">programmed target → board transform → corrected target</text>

  <!-- Right-panel actual board in measured orientation -->
  <g transform="translate(20,14) rotate(4 1745 500)">
    <rect x="1480" y="330" width="530" height="340" rx="17" class="pcb"/>
    <circle cx="1535" cy="382" r="17" class="fid"/>
    <circle cx="1950" cy="615" r="17" class="fid"/>

    <!-- corrected targets on actual board frame -->
    <circle cx="1645" cy="455" r="20" class="target-corr"/>
    <line x1="1627" y1="455" x2="1663" y2="455" stroke="#2f6f9f" stroke-width="4"/>
    <line x1="1645" y1="437" x2="1645" y2="473" stroke="#2f6f9f" stroke-width="4"/>
    <circle cx="1840" cy="545" r="20" class="target-corr"/>
    <line x1="1822" y1="545" x2="1858" y2="545" stroke="#2f6f9f" stroke-width="4"/>
    <line x1="1840" y1="527" x2="1840" y2="563" stroke="#2f6f9f" stroke-width="4"/>

    <rect x="1615" y="380" width="85" height="55" rx="8" fill="#4e5963"/>
    <rect x="1810" y="470" width="78" height="52" rx="8" fill="#4e5963"/>
  </g>

  <!-- programmed targets shown faintly at pre-transform positions -->
  <circle cx="1645" cy="455" r="16" class="target-open"/>
  <circle cx="1840" cy="545" r="16" class="target-open"/>
  <line x1="1660" y1="458" x2="1678" y2="462" class="leader"/>
  <line x1="1855" y1="548" x2="1867" y2="565" class="leader"/>
  <rect x="1460" y="688" width="500" height="54" rx="15" fill="#ffffff" stroke="#c6d4de" stroke-width="3"/>
  <circle cx="1490" cy="715" r="10" class="target-open"/>
  <text x="1510" y="723" class="tiny">programmed</text>
  <circle cx="1665" cy="715" r="10" class="target-corr"/>
  <line x1="1657" y1="715" x2="1673" y2="715" stroke="#2f6f9f" stroke-width="3"/>
  <line x1="1665" y1="707" x2="1665" y2="723" stroke="#2f6f9f" stroke-width="3"/>
  <text x="1685" y="723" class="tiny">corrected with board</text>

  <!-- RIGHT BOTTOM INSET -->
  <rect x="1320" y="840" width="850" height="380" rx="28" fill="#f4f7f9" stroke="#bdceda" stroke-width="4"/>
  <text x="1370" y="895" class="label bold">Local fiducial awareness</text>
  <text x="1370" y="933" class="small">Additional nearby registration reference when used</text>

  <!-- Fine-pitch local region -->
  <rect x="1510" y="995" width="280" height="135" rx="16" fill="#ffffff" stroke="#667887" stroke-width="4"/>
  <rect x="1590" y="1022" width="120" height="80" rx="10" fill="#4e5963"/>
  <g fill="#d7b94d" stroke="#957927" stroke-width="2">
    <rect x="1528" y="1010" width="38" height="14"/>
    <rect x="1528" y="1037" width="38" height="14"/>
    <rect x="1528" y="1064" width="38" height="14"/>
    <rect x="1734" y="1010" width="38" height="14"/>
    <rect x="1734" y="1037" width="38" height="14"/>
    <rect x="1734" y="1064" width="38" height="14"/>
  </g>

  <circle cx="1875" cy="1045" r="18" class="fid"/>
  <text x="1918" y="1038" class="small">Local fiducial</text>
  <text x="1918" y="1074" class="tiny">(when used)</text>
  <path d="M1900 1045 L1893 1045" class="leader"/>

  <rect x="1415" y="1155" width="660" height="45" rx="16" fill="#fff6e9" stroke="#ddb980" stroke-width="3"/>
  <text x="1745" y="1187" text-anchor="middle" class="tiny">Not every component or product uses a local fiducial</text>
</svg>