<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1500" viewBox="0 0 2320 1500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2b8f83"/>
    </marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#c47b2a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#596a78"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#20364f; font-size:40px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill:#415364; font-size:32px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill:#536575; font-size:27px; }
      .bold { font-weight:700; }
      .machine { fill:#d9e1e7; stroke:#667887; stroke-width:5; }
      .machine2 { fill:#b8c4ce; stroke:#596a78; stroke-width:5; }
      .dark { fill:#61717f; stroke:#465563; stroke-width:5; }
      .panel { fill:#f6f9fb; stroke:#c8d8e5; stroke-width:4; }
      .leader { fill:none; stroke:#596a78; stroke-width:4; }
      .sight-teal { fill:none; stroke:#2b8f83; stroke-width:5; stroke-dasharray:12 10; }
      .sight-amber { fill:none; stroke:#c47b2a; stroke-width:5; stroke-dasharray:12 10; }
      .motion2 { fill:none; stroke:#2f6f9f; stroke-width:8; marker-start:url(#arrow-blue); marker-end:url(#arrow-blue); }
    </style>
  </defs>

  <!-- Explicit full-canvas background -->
  <rect x="0" y="0" width="2320" height="1500" fill="#ffffff"/>

  <!-- X-Y motion structure -->
  <rect x="500" y="205" width="1310" height="130" rx="24" class="machine"/>
  <rect x="575" y="245" width="1160" height="40" rx="15" fill="#8596a4"/>
  <rect x="550" y="335" width="92" height="620" rx="16" class="machine2"/>
  <rect x="1650" y="335" width="92" height="620" rx="16" class="machine2"/>

  <!-- X motion -->
  <line x1="780" y1="138" x2="1425" y2="138" class="motion2"/>
  <text x="1102" y="108" text-anchor="middle" class="label bold">X motion</text>

  <!-- Y motion -->
  <line x1="1515" y1="405" x2="1375" y2="545" class="motion2"/>
  <text x="1565" y="490" class="label bold">Y motion</text>
  <text x="1565" y="528" class="tiny">front / back in placement plane</text>

  <!-- placement head -->
  <rect x="1065" y="240" width="240" height="118" rx="20" class="dark"/>
  <rect x="1090" y="358" width="190" height="220" rx="22" fill="#8394a2" stroke="#465563" stroke-width="5"/>
  <rect x="1157" y="578" width="54" height="170" rx="16" fill="#657582" stroke="#465563" stroke-width="5"/>
  <path d="M1168 748 L1200 748 L1225 837 L1143 837 Z" fill="#8797a4" stroke="#465563" stroke-width="5"/>
  <rect x="1157" y="837" width="54" height="31" rx="7" fill="#3b4650"/>
  <rect x="1162" y="868" width="44" height="20" rx="4" fill="#d8a735" stroke="#7d6523" stroke-width="3"/>

  <!-- placement-head label -->
  <path d="M710 355 L1060 355" class="leader" marker-end="url(#arrow-gray)"/>
  <text x="120" y="338" class="label bold">Placement head</text>
  <text x="120" y="380" class="small">carries nozzle; controls Z and θ</text>

  <!-- board-recognition camera -->
  <rect x="1012" y="555" width="58" height="76" rx="11" fill="#2b8f83" stroke="#236d65" stroke-width="4"/>
  <circle cx="1041" cy="616" r="12" fill="#d9ffff" stroke="#236d65" stroke-width="3"/>
  <path d="M660 520 L1007 575" class="leader" marker-end="url(#arrow-teal)"/>
  <text x="120" y="500" class="label bold">Board-recognition camera</text>
  <text x="120" y="542" class="small">finds PCB fiducial</text>

  <!-- vacuum nozzle label -->
  <path d="M855 690 L1145 785" class="leader" marker-end="url(#arrow-gray)"/>
  <text x="690" y="662" class="label bold">Vacuum nozzle</text>
  <text x="690" y="704" class="small">holds component</text>
  <line x1="1184" y1="820" x2="1184" y2="700" stroke="#2f6f9f" stroke-width="6" marker-end="url(#arrow-blue)"/>

  <!-- Z motion -->
  <line x1="1390" y1="600" x2="1390" y2="870" class="motion2"/>
  <text x="1435" y="740" class="label bold">Z motion</text>

  <!-- theta rotation -->
  <path d="M1120 792 A88 64 0 1 1 1250 792" fill="none" stroke="#2f6f9f" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <text x="1092" y="807" class="label bold">θ</text>
  <text x="1065" y="845" class="tiny">rotation</text>

  <!-- feeder bank -->
  <rect x="85" y="820" width="485" height="410" rx="28" fill="#eef4f8" stroke="#9db7ca" stroke-width="4"/>
  <text x="327" y="880" text-anchor="middle" class="label bold">Feeder bank</text>
  <text x="327" y="922" text-anchor="middle" class="small">known pickup locations</text>
  <g transform="translate(135,965)">
    <rect x="0" y="0" width="68" height="165" rx="10" fill="#93abc0" stroke="#5f7486" stroke-width="4"/>
    <rect x="84" y="0" width="68" height="165" rx="10" fill="#93abc0" stroke="#5f7486" stroke-width="4"/>
    <rect x="168" y="0" width="68" height="165" rx="10" fill="#93abc0" stroke="#5f7486" stroke-width="4"/>
    <rect x="252" y="0" width="68" height="165" rx="10" fill="#93abc0" stroke="#5f7486" stroke-width="4"/>
    <rect x="336" y="0" width="68" height="165" rx="10" fill="#93abc0" stroke="#5f7486" stroke-width="4"/>
    <circle cx="34" cy="30" r="10" fill="#e4b84b"/><circle cx="118" cy="30" r="10" fill="#e4b84b"/>
    <circle cx="202" cy="30" r="10" fill="#e4b84b"/><circle cx="286" cy="30" r="10" fill="#e4b84b"/>
    <circle cx="370" cy="30" r="10" fill="#e4b84b"/>
    <rect x="19" y="96" width="30" height="21" rx="4" fill="#404a53"/>
    <rect x="103" y="96" width="30" height="21" rx="4" fill="#404a53"/>
    <rect x="187" y="96" width="30" height="21" rx="4" fill="#404a53"/>
    <rect x="271" y="96" width="30" height="21" rx="4" fill="#404a53"/>
    <rect x="355" y="96" width="30" height="21" rx="4" fill="#404a53"/>
  </g>

  <!-- component-recognition station -->
  <rect x="665" y="755" width="125" height="100" rx="18" fill="#c9934a" stroke="#8b632d" stroke-width="5"/>
  <circle cx="728" cy="795" r="27" fill="#fae1b6" stroke="#8b632d" stroke-width="4"/>
  <line x1="728" y1="750" x2="728" y2="672" class="sight-amber"/>
  <rect x="708" y="635" width="40" height="25" rx="4" fill="#d8a735" stroke="#7d6523" stroke-width="3"/>
  <line x1="728" y1="635" x2="728" y2="595" stroke="#596a78" stroke-width="8"/>

  <!-- board-camera sight line -->
  <line x1="1041" y1="630" x2="1025" y2="1174" class="sight-teal"/>
  <circle cx="1025" cy="1192" r="27" fill="none" stroke="#2b8f83" stroke-width="5"/>
  <text x="865" y="1205" class="small" fill="#236d65">Fiducial</text>
  <path d="M945 1200 L997 1194" fill="none" stroke="#2b8f83" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- placement site -->
  <line x1="1184" y1="888" x2="1184" y2="1165" stroke="#2f6f9f" stroke-width="5" stroke-dasharray="10 9"/>
  <text x="1228" y="1080" class="tiny">placement site</text>

  <!-- component-camera callout; opaque panel keeps sight/placement lines out of text -->
  <rect x="585" y="875" width="810" height="130" rx="22" fill="#fff7ec" stroke="#ddb880" stroke-width="3"/>
  <path d="M760 875 L745 850" fill="none" stroke="#c47b2a" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <text x="620" y="920" class="label bold">Component-recognition camera</text>
  <text x="620" y="961" class="small">measures picked-part X/Y/θ pickup offset</text>
  <text x="620" y="993" class="tiny">Example fixed upward-looking arrangement — layouts vary</text>

  <!-- controller -->
  <rect x="1815" y="275" width="360" height="210" rx="28" class="panel"/>
  <text x="1995" y="333" text-anchor="middle" class="label bold">Machine controller</text>
  <text x="1995" y="386" text-anchor="middle" class="small">job + vision + motion</text>
  <line x1="1815" y1="430" x2="1305" y2="325" stroke="#9aaab7" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- conveyor/support -->
  <rect x="650" y="1090" width="1430" height="280" rx="34" fill="#edf1f4" stroke="#7a8d9c" stroke-width="5"/>
  <rect x="700" y="1120" width="1330" height="31" rx="12" fill="#7e8e9b"/>
  <rect x="700" y="1305" width="1330" height="31" rx="12" fill="#7e8e9b"/>
  <line x1="1940" y1="1220" x2="2045" y2="1220" stroke="#596a78" stroke-width="7" marker-end="url(#arrow-gray)"/>
  <text x="1760" y="1188" class="small">board transport</text>

  <!-- PCB -->
  <rect x="980" y="1170" width="665" height="110" rx="12" fill="#7fb487" stroke="#477c56" stroke-width="5"/>
  <path d="M945 1155 L945 1295" stroke="#657582" stroke-width="12"/>
  <path d="M1680 1155 L1680 1295" stroke="#657582" stroke-width="12"/>
  <g fill="#d7b94d" stroke="#997c28" stroke-width="2">
    <rect x="1050" y="1208" width="70" height="26" rx="4"/>
    <rect x="1155" y="1208" width="70" height="26" rx="4"/>
    <rect x="1260" y="1208" width="70" height="26" rx="4"/>
    <rect x="1365" y="1208" width="70" height="26" rx="4"/>
    <rect x="1470" y="1208" width="70" height="26" rx="4"/>
  </g>
  <circle cx="1025" cy="1192" r="14" fill="#f0d760" stroke="#5e6b75" stroke-width="4"/>
  <circle cx="1605" cy="1252" r="14" fill="#f0d760" stroke="#5e6b75" stroke-width="4"/>
  <text x="1365" y="1418" text-anchor="middle" class="label bold">PCB conveyor / support</text>
  <text x="1365" y="1460" text-anchor="middle" class="small">PCB held stable for placement</text>


</svg>