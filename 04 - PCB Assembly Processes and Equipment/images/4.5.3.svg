<path d="M1450,120 C1442,190 1458,275 1445,410" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.45"/>
<path d="M1500,120 C1492,190 1508,275 1495,410" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.45"/>
<path d="M1540,120 C1532,190 1548,275 1535,410" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.45"/>
<rect x="1280" y="175" width="185" height="105" rx="6" fill="#f4e8a4" stroke="#777" stroke-width="1.8"/>
<text x="1372" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#17212b" text-anchor="middle">MSL / CAUTION LABEL</text>
<path d="M1340,267 L1372,212 L1404,267 Z" fill="none" stroke="#000" stroke-width="5"/>
<circle cx="1372" cy="231" r="5" fill="#000"/>
<circle cx="1360" cy="249" r="4" fill="#000"/>
<circle cx="1384" cy="249" r="4" fill="#000"/>
<circle cx="1560" cy="300" r="88" fill="url(#reel)" stroke="#111" stroke-width="2"/>
<circle cx="1560" cy="300" r="22" fill="none" stroke="#555" stroke-width="1.5"/>
<circle cx="1560" cy="300" r="44" fill="none" stroke="#555" stroke-width="1.5"/>
<circle cx="1560" cy="300" r="67" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="1560" y1="300" x2="1603.0" y2="300.0" stroke="#222" stroke-width="6"/>
<line x1="1560" y1="300" x2="1581.5" y2="337.2" stroke="#222" stroke-width="6"/>
<line x1="1560" y1="300" x2="1538.5" y2="337.2" stroke="#222" stroke-width="6"/>
<line x1="1560" y1="300" x2="1517.0" y2="300.0" stroke="#222" stroke-width="6"/>
<line x1="1560" y1="300" x2="1538.5" y2="262.8" stroke="#222" stroke-width="6"/>
<line x1="1560" y1="300" x2="1581.5" y2="262.8" stroke="#222" stroke-width="6"/>
<circle cx="1560" cy="300" r="18" fill="#8c8c8c" stroke="#111" stroke-width="1.5"/>
<rect x="1305" y="315" width="110" height="120" fill="url(#bag)" stroke="#777" stroke-width="1.5" transform="rotate(-3 1360 375)"/>
<text x="1360" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="middle">DESICCANT</text>
<rect x="1425" y="365" width="130" height="68" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<circle cx="1455" cy="399" r="11" fill="#4b86bb" stroke="#111" stroke-width="1.5"/>
<circle cx="1490" cy="399" r="11" fill="#4b86bb" stroke="#111" stroke-width="1.5"/>
<circle cx="1525" cy="399" r="11" fill="#4b86bb" stroke="#111" stroke-width="1.5"/>
</g>
<text x="1665" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#344652" text-anchor="start">Moisture barrier bag</text>
<text x="1665" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#344652" text-anchor="start">(MBB)</text>
<path d="M 1650,170 L 1570,170" fill="none" stroke="#465765" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1665" y="255" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#344652" text-anchor="start">Device reel / tray</text>
<path d="M 1650,260 L 1628,282" fill="none" stroke="#465765" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1665" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#344652" text-anchor="start">Desiccant</text>
<path d="M 1650,355 L 1415,370" fill="none" stroke="#465765" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1665" y="435" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#344652" text-anchor="start">Humidity indicator</text>
<text x="1665" y="458" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#344652" text-anchor="start">card (HIC)</text>
<path d="M 1650,445 L 1560,410" fill="none" stroke="#465765" stroke-width="2.2" marker-end="url(#arrow)"/>
</g>
<g id="key-points">
<g id="key-panel"><rect x="1190" y="575" width="650" height="400" rx="18" fill="#e6f1fb" stroke="#62a9df" stroke-width="2.4" filter="url(#shadow)"/></g>
<text x="1240" y="623" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17212b" text-anchor="start">Key Points</text>
<text x="1230" y="680" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">•  Opening the bag starts controlled</text>
<text x="1230" y="708" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">   exposure tracking.</text>
<text x="1230" y="758" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">•  Dry storage or repack does not</text>
<text x="1230" y="786" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">   automatically reset floor life.</text>
<text x="1230" y="836" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">•  Unknown or exceeded status requires</text>
<text x="1230" y="864" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">   HOLD and approved recovery / disposition.</text>
<text x="1230" y="914" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">•  Follow the work instruction and</text>
<text x="1230" y="942" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="start">   component guidance.</text>
</g>
</svg>