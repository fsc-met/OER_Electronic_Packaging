<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1900" height="1180" fill="#ffffff"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7f8b95" flood-opacity="0.22"/>
  </filter>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#dfeefa"/><stop offset="100%" stop-color="#cfe2f2"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e3f4e6"/><stop offset="100%" stop-color="#d4ecd9"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe8e8"/><stop offset="100%" stop-color="#ffdada"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eee2ff"/><stop offset="100%" stop-color="#e3d2fb"/>
  </linearGradient>
  <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8f8f8"/><stop offset="30%" stop-color="#d5d5d5"/>
    <stop offset="55%" stop-color="#fafafa"/><stop offset="75%" stop-color="#bdbdbd"/>
    <stop offset="100%" stop-color="#ededed"/>
  </linearGradient>
  <radialGradient id="reel" cx="50%" cy="45%" r="65%">
    <stop offset="0%" stop-color="#5a5a5a"/><stop offset="55%" stop-color="#252525"/>
    <stop offset="100%" stop-color="#101010"/>
  </radialGradient>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L14,7 L0,14 z" fill="#465765"/>
  </marker>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L14,7 L0,14 z" fill="#4b8a64"/>
  </marker>
  <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L14,7 L0,14 z" fill="#a8782f"/>
  </marker>
</defs>
<g id="decision-tree">
<g id="start"><rect x="325" y="35" width="430" height="120" rx="16" fill="url(#blue)" stroke="#2f6795" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="540" y="78" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17212b" text-anchor="middle">Start</text>
<text x="540" y="114" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17212b" text-anchor="middle">Check device label</text>
<text x="540" y="138" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4d5f6d" text-anchor="middle">(MSL and floor life)</text>
<g id="decision-drypack"><polygon points="540,190.0 765.0,300 540,410.0 315.0,300" fill="#fff1b8" stroke="#78652d" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="540" y="258" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">Dry-pack status</text>
<text x="540" y="292" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">acceptable and known?</text>
<text x="540" y="325" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5f6d" text-anchor="middle">Sealed bag, label, desiccant,</text>
<text x="540" y="349" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5f6d" text-anchor="middle">HIC, and device identity OK?</text>
<g id="hold-before-open"><rect x="805" y="180" width="320" height="265" rx="16" fill="url(#pink)" stroke="#c95353" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="965" y="230" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">HOLD / Verify status</text>
<text x="965" y="272" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">Do not use or open.</text>
<text x="965" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">Check exposure history, HIC,</text>
<text x="965" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">storage history, and identity.</text>
<text x="965" y="359" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">Verify MSL and floor life.</text>
<text x="965" y="388" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">Follow approved handling</text>
<text x="965" y="417" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#344652" text-anchor="middle">guidance as required.</text>
<g id="open-track"><rect x="325" y="475" width="430" height="120" rx="16" fill="url(#blue)" stroke="#2f6795" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="540" y="518" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">Open bag and start</text>
<text x="540" y="552" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">exposure tracking</text>
<text x="540" y="575" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4d5f6d" text-anchor="middle">Record opening date and time</text>
<g id="decision-floorlife"><polygon points="540,630.0 755.0,735 540,840.0 325.0,735" fill="#fff1b8" stroke="#78652d" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="540" y="704" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">Within allowed</text>
<text x="540" y="738" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">floor-life exposure?</text>
<text x="540" y="772" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5f6d" text-anchor="middle">(Based on MSL and work instruction)</text>
<g id="use-allowed"><rect x="30" y="675" width="270" height="195" rx="16" fill="url(#green)" stroke="#4b8a64" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="165" y="716" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17212b" text-anchor="middle">Use within allowed</text>
<text x="165" y="748" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17212b" text-anchor="middle">floor life</text>
<text x="52" y="790" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="start">• Keep within remaining floor life.</text>
<text x="52" y="821" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="start">• Follow handling requirements.</text>
<g id="reflow-left"><rect x="15" y="985" width="300" height="100" rx="16" fill="url(#purple)" stroke="#7d58a6" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="165" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="middle">Proceed to assembly / reflow</text>
<text x="165" y="1053" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="middle">per work instruction</text>
<g id="recovery"><rect x="805" y="635" width="320" height="285" rx="16" fill="url(#pink)" stroke="#c95353" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="965" y="676" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17212b" text-anchor="middle">Follow approved</text>
<text x="965" y="708" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17212b" text-anchor="middle">recovery procedure</text>
<text x="965" y="752" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">Do not use until status</text>
<text x="965" y="780" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">is verified acceptable.</text>
<text x="965" y="808" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">Use approved drying / bake /</text>
<text x="965" y="836" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">repack / disposition as applicable.</text>
<text x="965" y="864" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">Verify readiness for use</text>
<text x="965" y="892" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#344652" text-anchor="middle">per component guidance.</text>
<g id="reflow-right"><rect x="805" y="985" width="320" height="100" rx="16" fill="url(#purple)" stroke="#7d58a6" stroke-width="2.5" filter="url(#shadow)"/></g>
<text x="965" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="middle">Proceed to assembly / reflow</text>
<text x="965" y="1053" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="middle">per work instruction</text>
<line x1="540" y1="155" x2="540" y2="184" stroke="#465765" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="540" y1="410" x2="540" y2="462" stroke="#465765" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="540" y1="595" x2="540" y2="622" stroke="#465765" stroke-width="3.2" marker-end="url(#arrow)"/>
<path d="M 765,300 L 795,300" fill="none" stroke="#a8782f" stroke-width="3.6" marker-end="url(#arrowAmber)"/>
<text x="782" y="276" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#8f6a2f" text-anchor="middle">No / unknown</text>
<text x="575" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4b8a64" text-anchor="middle">Yes</text>
<path d="M 325,735 L 307,735" fill="none" stroke="#4b8a64" stroke-width="3.6" marker-end="url(#arrowGreen)"/>
<text x="316" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4b8a64" text-anchor="middle">Yes</text>
<path d="M 755,735 L 795,735" fill="none" stroke="#a8782f" stroke-width="3.6" marker-end="url(#arrowAmber)"/>
<text x="778" y="710" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#8f6a2f" text-anchor="middle">No / unknown</text>
<line x1="165" y1="870" x2="165" y2="972" stroke="#465765" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="965" y1="920" x2="965" y2="938" stroke="#465765" stroke-width="3.2"/>
<text x="965" y="959" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#344652" text-anchor="middle">After status is verified acceptable</text>
<line x1="965" y1="969" x2="965" y2="972" stroke="#465765" stroke-width="3.2" marker-end="url(#arrow)"/>
</g>
<g id="mbb-components">
<g id="mbb-panel"><rect x="1190" y="35" width="650" height="495" rx="18" fill="#e8f4e9" stroke="#5aa36a" stroke-width="2.4" filter="url(#shadow)"/></g>
<text x="1515" y="78" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17212b" text-anchor="middle">Moisture Barrier Bag (MBB) Components</text>
<g id="bag-illustration">
<rect x="1230" y="115" width="330" height="300" rx="4" fill="url(#bag)" stroke="#6d6d6d" stroke-width="2"/>
<rect x="1230" y="115" width="330" height="20" fill="#cfcfcf"/>
<path d="M1240,120 C1232,190 1248,275 1235,410" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.45"/>
