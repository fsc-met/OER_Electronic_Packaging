<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1920" viewBox="0 0 3000 1920" preserveAspectRatio="xMidYMid meet">
<defs>
  <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L12,6 L0,12 z" fill="#3f607d"/>
  </marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L12,6 L0,12 z" fill="#5a8d67"/>
  </marker>
</defs>
<rect x="0" y="0" width="3000" height="1920" fill="#ffffff"/>
<style>
  .txt { font-family: Arial, Helvetica, sans-serif; fill:#243b53; }
  .panel { fill:#fbfcfd; stroke:#9fb0bd; stroke-width:4; }
  .headBlue { fill:#e7f0f6; }
  .headGreen { fill:#e8f2eb; }
  .headRoute { fill:#f2f5f7; }
  .board { fill:#76a97b; stroke:#3f6f4d; stroke-width:5; }
  .comp { fill:#aeb9c2; stroke:#64727e; stroke-width:4; }
  .compDark { fill:#8d9aa5; stroke:#5b6874; stroke-width:4; }
  .pad { fill:#d0a04b; stroke:#8c6a2e; stroke-width:3; }
  .call { fill:#ffffff; stroke:#b3c0ca; stroke-width:3; }
  .routeBox { fill:#eaf2f7; stroke:#7c9db5; stroke-width:4; }
  .routeGreen { fill:#edf6ef; stroke:#6e9a79; stroke-width:4; }
  .routePurple { fill:#f3f0f7; stroke:#9687ac; stroke-width:4; }
  .reason { fill:#fffaf0; stroke:#c49a55; stroke-width:4; }
  .zone { fill:#eef6ef; fill-opacity:0.72; stroke:#6f8f79; stroke-width:4; stroke-dasharray:16 12; }
  .leader { fill:none; stroke:#3f607d; stroke-width:4; marker-end:url(#arrowNavy); }
  .arrow { fill:none; stroke:#3f607d; stroke-width:5; marker-end:url(#arrowNavy); }
  .accessArrow { fill:none; stroke:#5a8d67; stroke-width:5; marker-end:url(#arrowGreen); }
</style>

<!-- top side panel -->
<g id="top-side-panel">
  <rect class="panel" x="80" y="70" width="1370" height="1050" rx="26"/>
  <path class="headBlue" d="M106,70 h1318 a26,26 0 0 1 26,26 v92 h-1370 v-92 a26,26 0 0 1 26,-26z"/>
  <text class="txt" x="765" y="138" text-anchor="middle" font-size="50" font-weight="700">Top side</text>
  <text class="txt" x="765" y="194" text-anchor="middle" font-size="32" fill="#4f6b82">Representative of ~70 top-side SMT components</text>

  <!-- board with orientation notch at upper right -->
  <path class="board" d="M220,300 H1230 V330 H1290 V860 H220 Z"/>
  <text class="txt" x="755" y="346" text-anchor="middle" font-size="28" font-weight="700" fill="#2f6040">Same fictional PCBA</text>

  <!-- planned THT connector body near edge -->
  <rect x="255" y="415" width="170" height="110" rx="14" fill="#f3f5f6" stroke="#6f7f8b" stroke-width="4" stroke-dasharray="12 10"/>
  <g id="conn-top-pins">
    <circle class="pad" cx="278" cy="535" r="5"/><circle class="pad" cx="291" cy="535" r="5"/><circle class="pad" cx="304" cy="535" r="5"/><circle class="pad" cx="317" cy="535" r="5"/><circle class="pad" cx="330" cy="535" r="5"/><circle class="pad" cx="343" cy="535" r="5"/><circle class="pad" cx="356" cy="535" r="5"/><circle class="pad" cx="369" cy="535" r="5"/><circle class="pad" cx="382" cy="535" r="5"/><circle class="pad" cx="395" cy="535" r="5"/>
    <circle class="pad" cx="278" cy="550" r="5"/><circle class="pad" cx="291" cy="550" r="5"/><circle class="pad" cx="304" cy="550" r="5"/><circle class="pad" cx="317" cy="550" r="5"/><circle class="pad" cx="330" cy="550" r="5"/><circle class="pad" cx="343" cy="550" r="5"/><circle class="pad" cx="356" cy="550" r="5"/><circle class="pad" cx="369" cy="550" r="5"/><circle class="pad" cx="382" cy="550" r="5"/><circle class="pad" cx="395" cy="550" r="5"/>
  </g>
  <text class="txt" x="340" y="395" text-anchor="middle" font-size="32" font-weight="700">20-pin THT connector</text>
  
  <!-- BGA -->
  <rect class="compDark" x="560" y="465" width="210" height="190" rx="18"/>
  <circle class="pad" cx="585" cy="674" r="6"/><circle class="pad" cx="617" cy="674" r="6"/><circle class="pad" cx="649" cy="674" r="6"/><circle class="pad" cx="681" cy="674" r="6"/><circle class="pad" cx="713" cy="674" r="6"/><circle class="pad" cx="745" cy="674" r="6"/>
  <text class="txt" x="665" y="450" text-anchor="middle" font-size="32" font-weight="700">BGA</text>

  <!-- larger SMT group -->
  <rect class="comp" x="880" y="430" width="190" height="90" rx="14"/>
  <rect class="comp" x="910" y="620" width="250" height="92" rx="14"/>
  <rect class="comp" x="495" y="735" width="160" height="68" rx="12"/>
  <text class="txt" x="1020" y="405" text-anchor="middle" font-size="32" font-weight="700">BGA / larger SMT</text>

  <!-- 2-lead THT power component -->
  <rect x="1110" y="690" width="110" height="92" rx="18" fill="#f3f5f6" stroke="#6f7f8b" stroke-width="4" stroke-dasharray="12 10"/>
  <line x1="1140" y1="782" x2="1140" y2="828" stroke="#8c6a2e" stroke-width="7"/>
  <line x1="1190" y1="782" x2="1190" y2="828" stroke="#8c6a2e" stroke-width="7"/>
  <text class="txt" x="1200" y="612" text-anchor="middle" font-size="30" font-weight="700">2-lead THT</text>
  <text class="txt" x="1200" y="648" text-anchor="middle" font-size="30" font-weight="700">power component</text>

  <rect class="call" x="350" y="900" width="820" height="135" rx="18"/>
  <text class="txt" x="760" y="956" text-anchor="middle" font-size="34" font-weight="700">Larger / complex SMT assigned to second reflow side</text>
  <text class="txt" x="760" y="1003" text-anchor="middle" font-size="27" fill="#5b7184">THT locations shown for planning; insert THT after both SMT passes.</text>
</g>

<!-- bottom side panel -->
<g id="bottom-side-panel">
  <rect class="panel" x="1550" y="70" width="1370" height="1050" rx="26"/>
  <path class="headGreen" d="M1576,70 h1318 a26,26 0 0 1 26,26 v92 h-1370 v-92 a26,26 0 0 1 26,-26z"/>
  <text class="txt" x="2235" y="138" text-anchor="middle" font-size="50" font-weight="700">Bottom side</text>
  <text class="txt" x="2235" y="194" text-anchor="middle" font-size="32" fill="#4f6b82">Small first-side SMT remains outside local solder-contact regions</text>

  <!-- mirrored board; notch now upper left -->
  <path class="board" d="M1690,330 H1750 V300 H2760 V860 H1690 Z"/>
  <text class="txt" x="2225" y="346" text-anchor="middle" font-size="28" font-weight="700" fill="#2f6040">Same board viewed from opposite side</text>

  <!-- power leads now left after mirror -->
  <circle class="pad" cx="1790" cy="735" r="13"/>
  <circle class="pad" cx="1840" cy="735" r="13"/>
  <rect class="zone" x="1725" y="665" width="185" height="150" rx="28"/>
  <text class="txt" x="1815" y="642" text-anchor="middle" font-size="30" font-weight="700">2-lead THT power</text>

  <!-- 18 bottom passives, 3x6 -->
  <g id="bottom-passives">
    <g><rect class="comp" x="1930" y="455" width="66" height="34" rx="7"/><rect class="pad" x="1922" y="463" width="10" height="18"/><rect class="pad" x="1996" y="463" width="10" height="18"/></g><g><rect class="comp" x="2035" y="455" width="66" height="34" rx="7"/><rect class="pad" x="2027" y="463" width="10" height="18"/><rect class="pad" x="2101" y="463" width="10" height="18"/></g><g><rect class="comp" x="2140" y="455" width="66" height="34" rx="7"/><rect class="pad" x="2132" y="463" width="10" height="18"/><rect class="pad" x="2206" y="463" width="10" height="18"/></g><g><rect class="comp" x="2245" y="455" width="66" height="34" rx="7"/><rect class="pad" x="2237" y="463" width="10" height="18"/><rect class="pad" x="2311" y="463" width="10" height="18"/></g><g><rect class="comp" x="2350" y="455" width="66" height="34" rx="7"/><rect class="pad" x="2342" y="463" width="10" height="18"/><rect class="pad" x="2416" y="463" width="10" height="18"/></g><g><rect class="comp" x="2455" y="455" width="66" height="34" rx="7"/><rect class="pad" x="2447" y="463" width="10" height="18"/><rect class="pad" x="2521" y="463" width="10" height="18"/></g><g><rect class="comp" x="1930" y="560" width="66" height="34" rx="7"/><rect class="pad" x="1922" y="568" width="10" height="18"/><rect class="pad" x="1996" y="568" width="10" height="18"/></g><g><rect class="comp" x="2035" y="560" width="66" height="34" rx="7"/><rect class="pad" x="2027" y="568" width="10" height="18"/><rect class="pad" x="2101" y="568" width="10" height="18"/></g><g><rect class="comp" x="2140" y="560" width="66" height="34" rx="7"/><rect class="pad" x="2132" y="568" width="10" height="18"/><rect class="pad" x="2206" y="568" width="10" height="18"/></g><g><rect class="comp" x="2245" y="560" width="66" height="34" rx="7"/><rect class="pad" x="2237" y="568" width="10" height="18"/><rect class="pad" x="2311" y="568" width="10" height="18"/></g><g><rect class="comp" x="2350" y="560" width="66" height="34" rx="7"/><rect class="pad" x="2342" y="568" width="10" height="18"/><rect class="pad" x="2416" y="568" width="10" height="18"/></g><g><rect class="comp" x="2455" y="560" width="66" height="34" rx="7"/><rect class="pad" x="2447" y="568" width="10" height="18"/><rect class="pad" x="2521" y="568" width="10" height="18"/></g><g><rect class="comp" x="1930" y="665" width="66" height="34" rx="7"/><rect class="pad" x="1922" y="673" width="10" height="18"/><rect class="pad" x="1996" y="673" width="10" height="18"/></g><g><rect class="comp" x="2035" y="665" width="66" height="34" rx="7"/><rect class="pad" x="2027" y="673" width="10" height="18"/><rect class="pad" x="2101" y="673" width="10" height="18"/></g><g><rect class="comp" x="2140" y="665" width="66" height="34" rx="7"/><rect class="pad" x="2132" y="673" width="10" height="18"/><rect class="pad" x="2206" y="673" width="10" height="18"/></g><g><rect class="comp" x="2245" y="665" width="66" height="34" rx="7"/><rect class="pad" x="2237" y="673" width="10" height="18"/><rect class="pad" x="2311" y="673" width="10" height="18"/></g><g><rect class="comp" x="2350" y="665" width="66" height="34" rx="7"/><rect class="pad" x="2342" y="673" width="10" height="18"/><rect class="pad" x="2416" y="673" width="10" height="18"/></g><g><rect class="comp" x="2455" y="665" width="66" height="34" rx="7"/><rect class="pad" x="2447" y="673" width="10" height="18"/><rect class="pad" x="2521" y="673" width="10" height="18"/></g>
  </g>
  <text class="txt" x="2225" y="815" text-anchor="middle" font-size="34" font-weight="700">18 small bottom-side SMT passives</text>

  <!-- connector pin field mirrored to right edge -->
  <g id="connector-bottom-pins">
    <circle class="pad" cx="2595" cy="515" r="7"/><circle class="pad" cx="2608" cy="515" r="7"/><circle class="pad" cx="2621" cy="515" r="7"/><circle class="pad" cx="2634" cy="515" r="7"/><circle class="pad" cx="2647" cy="515" r="7"/><circle class="pad" cx="2660" cy="515" r="7"/><circle class="pad" cx="2673" cy="515" r="7"/><circle class="pad" cx="2686" cy="515" r="7"/><circle class="pad" cx="2699" cy="515" r="7"/><circle class="pad" cx="2712" cy="515" r="7"/>
    <circle class="pad" cx="2595" cy="540" r="7"/><circle class="pad" cx="2608" cy="540" r="7"/><circle class="pad" cx="2621" cy="540" r="7"/><circle class="pad" cx="2634" cy="540" r="7"/><circle class="pad" cx="2647" cy="540" r="7"/><circle class="pad" cx="2660" cy="540" r="7"/><circle class="pad" cx="2673" cy="540" r="7"/><circle class="pad" cx="2686" cy="540" r="7"/><circle class="pad" cx="2699" cy="540" r="7"/><circle class="pad" cx="2712" cy="540" r="7"/>
  </g>
  <rect class="zone" x="2540" y="440" width="205" height="180" rx="30"/>
  <text class="txt" x="2615" y="414" text-anchor="middle" font-size="30" font-weight="700">20-pin connector pin field</text>

  <!-- local nozzle symbols -->
  <g id="selective-nozzles">
    <path d="M1775,900 h80 l22,70 h-124 z" fill="#aeb9c2" stroke="#64727e" stroke-width="4"/>
    <line class="accessArrow" x1="1815" y1="896" x2="1815" y2="815"/>
    <path d="M2600,900 h80 l22,70 h-124 z" fill="#aeb9c2" stroke="#64727e" stroke-width="4"/>
    <line class="accessArrow" x1="2640" y1="896" x2="2640" y2="620"/>
  </g>
  <text class="txt" x="2235" y="1005" text-anchor="middle" font-size="34" font-weight="700" fill="#507e5c">Selective-nozzle access</text>
  <text class="txt" x="2235" y="1045" text-anchor="middle" font-size="28" fill="#5b7184">available at both local THT groups</text>
  <text class="txt" x="2235" y="1083" text-anchor="middle" font-size="28" fill="#5b7184">Bottom SMT outside solder-contact region</text>
</g>

<!-- correspondence note -->
<g id="correspondence-note">
  <text class="txt" x="1500" y="1190" text-anchor="middle" font-size="28" fill="#647789">Same board shown from opposite sides; THT locations correspond across the two views.</text>
</g>

<!-- process route panel -->
<g id="route-panel">
  <rect class="panel" x="80" y="1245" width="2840" height="600" rx="26"/>
  <path class="headRoute" d="M106,1245 h2788 a26,26 0 0 1 26,26 v86 h-2840 v-86 a26,26 0 0 1 26,-26z"/>
  <text class="txt" x="1500" y="1310" text-anchor="middle" font-size="44" font-weight="700">Selected route for this bounded case</text>

  <rect class="reason" x="615" y="1378" width="1770" height="128" rx="18"/>
  <text class="txt" x="1500" y="1426" text-anchor="middle" font-size="36" font-weight="700">Why selective here?</text>
  <text class="txt" x="1500" y="1472" text-anchor="middle" font-size="30">Two local THT groups   •   Bottom SMT avoids broad wave contact   •   Usable nozzle access</text>

  <!-- route boxes -->
  <g id="route-boxes">
    <rect class="routeBox" x="130" y="1560" width="400" height="160" rx="18"/>
    <text class="txt" x="330" y="1620" text-anchor="middle" font-size="34" font-weight="700">Bottom SMT first</text>
    <text class="txt" x="330" y="1668" text-anchor="middle" font-size="28">Print / Place / Reflow</text>

    <rect class="routeBox" x="595" y="1560" width="300" height="160" rx="18"/>
    <text class="txt" x="745" y="1651" text-anchor="middle" font-size="36" font-weight="700">Flip</text>

    <rect class="routeBox" x="960" y="1560" width="400" height="160" rx="18"/>
    <text class="txt" x="1160" y="1620" text-anchor="middle" font-size="34" font-weight="700">Top SMT second</text>
    <text class="txt" x="1160" y="1668" text-anchor="middle" font-size="28">Print / Place / Reflow</text>

    <rect class="routeGreen" x="1425" y="1560" width="340" height="160" rx="18"/>
    <text class="txt" x="1595" y="1620" text-anchor="middle" font-size="32" font-weight="700">Insert THT after SMT</text>
    <text class="txt" x="1595" y="1668" text-anchor="middle" font-size="26">after both reflow passes</text>

    <rect class="routePurple" x="1830" y="1560" width="355" height="160" rx="18"/>
    <text class="txt" x="2007" y="1650" text-anchor="middle" font-size="34" font-weight="700">Selective solder</text>

    <rect class="routeBox" x="2250" y="1560" width="520" height="160" rx="18"/>
    <text class="txt" x="2510" y="1620" text-anchor="middle" font-size="34" font-weight="700">Downstream verification</text>
    <text class="txt" x="2510" y="1668" text-anchor="middle" font-size="26">inspection / test as required</text>
  </g>

  <!-- arrows between route boxes -->
  <line class="arrow" x1="530" y1="1640" x2="580" y2="1640"/>
  <line class="arrow" x1="895" y1="1640" x2="945" y2="1640"/>
  <line class="arrow" x1="1360" y1="1640" x2="1410" y2="1640"/>
  <line class="arrow" x1="1765" y1="1640" x2="1815" y2="1640"/>
  <line class="arrow" x1="2185" y1="1640" x2="2235" y2="1640"/>

</g>
</svg>