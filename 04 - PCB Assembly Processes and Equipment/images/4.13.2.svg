<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1380" viewBox="0 0 1960 1380" preserveAspectRatio="xMidYMid meet">
  <style>
    .colhead { font-family: Arial, Helvetica, sans-serif; font-size:40px; font-weight:700; fill:#20364f; }
    .rowhead { font-family: Arial, Helvetica, sans-serif; font-size:35px; font-weight:700; fill:#20364f; }
    .body { font-family: Arial, Helvetica, sans-serif; font-size:28px; fill:#415364; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size:25px; fill:#536575; }
    .panel { fill:#f7fafc; stroke:#bfd0dc; stroke-width:4; }
    .target { fill:#ffffff; stroke:#536d80; stroke-width:5; }
    .cross { stroke:#536d80; stroke-width:5; }
    .dot { fill:#c47b2a; stroke:#ffffff; stroke-width:3; }
    .note { fill:#eef4f8; stroke:#b7cbd9; stroke-width:3; }
    .warn { fill:#fff6e9; stroke:#ddb980; stroke-width:3; }
  </style>

  <rect x="0" y="0" width="1960" height="1380" fill="#ffffff"/>

  <!-- Column headings -->
  <rect x="330" y="55" width="560" height="80" rx="22" class="note"/>
  <text x="610" y="106" text-anchor="middle" class="colhead">Average near target</text>
  <rect x="1130" y="55" width="560" height="80" rx="22" class="note"/>
  <text x="1410" y="106" text-anchor="middle" class="colhead">Average offset from target</text>

  <!-- Row headings -->
  <rect x="52" y="245" width="215" height="112" rx="20" class="note"/>
  <text x="160" y="292" text-anchor="middle" class="rowhead">Tight</text>
  <text x="160" y="334" text-anchor="middle" class="rowhead">cluster</text>

  <rect x="52" y="775" width="215" height="112" rx="20" class="note"/>
  <text x="160" y="822" text-anchor="middle" class="rowhead">Wide</text>
  <text x="160" y="864" text-anchor="middle" class="rowhead">scatter</text>

  <!-- Four equal panels -->
  <rect x="300" y="175" width="620" height="470" rx="28" class="panel"/>
  <rect x="1100" y="175" width="620" height="470" rx="28" class="panel"/>
  <rect x="300" y="705" width="620" height="470" rx="28" class="panel"/>
  <rect x="1100" y="705" width="620" height="470" rx="28" class="panel"/>

  <!-- Panel 1 target + tight centered cluster -->
  <rect x="425" y="265" width="330" height="330" rx="24" class="target"/>
  <line x1="590" y1="282" x2="590" y2="578" class="cross"/>
  <line x1="442" y1="430" x2="738" y2="430" class="cross"/>
  <circle cx="574" cy="422" r="14" class="dot"/>
<circle cx="582" cy="442" r="14" class="dot"/>
<circle cx="590" cy="416" r="14" class="dot"/>
<circle cx="601" cy="437" r="14" class="dot"/>
<circle cx="606" cy="428" r="14" class="dot"/>
<circle cx="578" cy="434" r="14" class="dot"/>
<circle cx="597" cy="445" r="14" class="dot"/>
<circle cx="587" cy="427" r="14" class="dot"/>
<circle cx="594" cy="423" r="14" class="dot"/>
<circle cx="591" cy="426" r="14" class="dot"/>

  <!-- Panel 2 target + tight biased cluster -->
  <rect x="1245" y="265" width="330" height="330" rx="24" class="target"/>
  <line x1="1410" y1="282" x2="1410" y2="578" class="cross"/>
  <line x1="1262" y1="430" x2="1558" y2="430" class="cross"/>
  <circle cx="1489" cy="357" r="14" class="dot"/>
<circle cx="1497" cy="377" r="14" class="dot"/>
<circle cx="1505" cy="351" r="14" class="dot"/>
<circle cx="1516" cy="372" r="14" class="dot"/>
<circle cx="1521" cy="363" r="14" class="dot"/>
<circle cx="1493" cy="369" r="14" class="dot"/>
<circle cx="1512" cy="380" r="14" class="dot"/>
<circle cx="1502" cy="362" r="14" class="dot"/>
<circle cx="1509" cy="358" r="14" class="dot"/>
<circle cx="1506" cy="361" r="14" class="dot"/>
  <rect x="1245" y="594" width="330" height="62" rx="18" class="warn"/>
  <text x="1410" y="635" text-anchor="middle" class="body">repeatable but biased</text>

  <!-- Panel 3 target + wide centered scatter -->
  <rect x="425" y="795" width="330" height="330" rx="24" class="target"/>
  <line x1="590" y1="812" x2="590" y2="1108" class="cross"/>
  <line x1="442" y1="960" x2="738" y2="960" class="cross"/>
  <circle cx="495" cy="905" r="14" class="dot"/>
<circle cx="675" cy="895" r="14" class="dot"/>
<circle cx="520" cy="1035" r="14" class="dot"/>
<circle cx="665" cy="1025" r="14" class="dot"/>
<circle cx="555" cy="865" r="14" class="dot"/>
<circle cx="630" cy="1050" r="14" class="dot"/>
<circle cx="485" cy="975" r="14" class="dot"/>
<circle cx="690" cy="965" r="14" class="dot"/>
<circle cx="570" cy="995" r="14" class="dot"/>
<circle cx="615" cy="890" r="14" class="dot"/>

  <!-- Panel 4 target + wide biased scatter -->
  <rect x="1245" y="795" width="330" height="330" rx="24" class="target"/>
  <line x1="1410" y1="812" x2="1410" y2="1108" class="cross"/>
  <line x1="1262" y1="960" x2="1558" y2="960" class="cross"/>
  <circle cx="1410" cy="840" r="14" class="dot"/>
<circle cx="1590" cy="830" r="14" class="dot"/>
<circle cx="1435" cy="970" r="14" class="dot"/>
<circle cx="1580" cy="960" r="14" class="dot"/>
<circle cx="1470" cy="800" r="14" class="dot"/>
<circle cx="1545" cy="985" r="14" class="dot"/>
<circle cx="1400" cy="910" r="14" class="dot"/>
<circle cx="1605" cy="900" r="14" class="dot"/>
<circle cx="1485" cy="930" r="14" class="dot"/>
<circle cx="1530" cy="825" r="14" class="dot"/>

  <!-- Legend / core teaching note -->
  <rect x="330" y="1205" width="1360" height="125" rx="22" fill="#ffffff" stroke="#c5d2dc" stroke-width="3"/>
  <circle cx="500" cy="1246" r="14" class="dot"/>
  <text x="530" y="1255" class="body">repeated placement center</text>

  <rect x="1035" y="1221" width="50" height="50" rx="6" class="target"/>
  <line x1="1060" y1="1228" x2="1060" y2="1264" class="cross"/>
  <line x1="1042" y1="1246" x2="1078" y2="1246" class="cross"/>
  <text x="1105" y="1255" class="body">intended target</text>

  <text x="980" y="1304" text-anchor="middle" class="body">Cluster location indicates bias; cluster spread indicates repeatability.</text>
</svg>