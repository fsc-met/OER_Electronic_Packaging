<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="2050" viewBox="0 0 3800 2050" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="arrowBlue" markerWidth="18" markerHeight="18" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L0,12 L16,6 z" fill="#3F6179"/>
  </marker>
  <marker id="arrowTeal" markerWidth="18" markerHeight="18" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L0,12 L16,6 z" fill="#3D7B82"/>
  </marker>
  <marker id="arrowAmber" markerWidth="18" markerHeight="18" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L0,12 L16,6 z" fill="#B85C3E"/>
  </marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#22313F}
    .panelTitle{font-size:46px;font-weight:700}
    .metric{font-size:42px;font-weight:700}
    .body{font-size:35px}
    .small{font-size:31px}
    .tiny{font-size:27px}
    .conclusion{font-size:48px;font-weight:700}
  </style>
</defs>
<rect x="90" y="90" width="845" height="1110" rx="28" fill="#EEF5FA" stroke="#6E98B8" stroke-width="4"/>
