<rect x="1455" y="575" width="180" height="72" rx="8" fill="#D6DEE4" stroke="#66757F" stroke-width="3"/>
<rect x="1475" y="593" width="140" height="36" rx="6" fill="#BCC6CD" stroke="#8A9AA8" stroke-width="2"/>
<rect x="1330" y="530" width="215" height="160" rx="16" fill="#4E5961" stroke="#25313A" stroke-width="5"/>
<rect x="1305" y="545" width="35" height="130" rx="5" fill="#D8DADD" stroke="#8A9AA8" stroke-width="3"/>
<rect x="1545" y="545" width="35" height="130" rx="5" fill="#D8DADD" stroke="#8A9AA8" stroke-width="3"/>
<text x="1437.5" y="820" class="metric" text-anchor="middle">
<tspan x="1437.5" dy="0">R17 centered before reflow</tspan>
</text>
<circle cx="1165" cy="920" r="16" fill="#4F9362"/>
<path d="M 1157 912 l 7 7 l 14 -17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1202" y="930" class="body" text-anchor="start">correct component / orientation</text>
<circle cx="1165" cy="995" r="16" fill="#4F9362"/>
<path d="M 1157 987 l 7 7 l 14 -17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1202" y="1005" class="body" text-anchor="start">no gross placement error observed</text>


<rect x="2045" y="425" width="635" height="205" rx="20" fill="#ffffff" stroke="#B29B6F" stroke-width="3"/>
<text x="2090" y="483" class="body" text-anchor="start" font-weight="700">Peak</text>
<text x="2090" y="538" class="metric" text-anchor="start">241 °C</text>
<text x="2090" y="590" class="small" text-anchor="start">supplied window: 235-245 °C</text>
<rect x="2530" y="497" width="115" height="54" rx="14" fill="#4F9362"/>
<text x="2587.5" y="534" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">PASS</text>
<rect x="2045" y="685" width="635" height="205" rx="20" fill="#ffffff" stroke="#B29B6F" stroke-width="3"/>
<text x="2090" y="743" class="body" text-anchor="start" font-weight="700">TAL</text>
<text x="2090" y="798" class="metric" text-anchor="start">66 s above 217 °C</text>
<text x="2090" y="850" class="small" text-anchor="start">supplied window: 45-90 s</text>
<rect x="2530" y="757" width="115" height="54" rx="14" fill="#4F9362"/>
<text x="2587.5" y="794" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">PASS</text>
<text x="2362.5" y="965" class="body" text-anchor="middle" font-weight="700">
<tspan x="2362.5" dy="0">Within the two supplied case limits</tspan>
</text>
<text x="2362.5" y="1025" class="small" text-anchor="middle" fill="#5D6B78">
<tspan x="2362.5" dy="0">Nearby pass evidence does not prove</tspan>
<tspan x="2362.5" dy="40">every board location is identical.</tspan>
</text>
<rect x="2985" y="760" width="605" height="70" rx="10" fill="#DCEFEA" stroke="#4F9362" stroke-width="4"/>
<rect x="3050" y="728" width="170" height="38" rx="7" fill="#B9C3C9" stroke="#707B82" stroke-width="3"/>
<rect x="3365" y="728" width="170" height="38" rx="7" fill="#B9C3C9" stroke="#707B82" stroke-width="3"/>
