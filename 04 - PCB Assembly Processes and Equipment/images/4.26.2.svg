<tspan x="512.5" dy="0">A. SPI evidence</tspan>
<tspan x="512.5" dy="48">R17 paste deposits</tspan>
</text>
<rect x="1015" y="90" width="845" height="1110" rx="28" fill="#EEF6EC" stroke="#7FAE76" stroke-width="4"/>
<text x="1437.5" y="155" class="panelTitle" text-anchor="middle">
<tspan x="1437.5" dy="0">B. Pre-reflow placement</tspan>
<tspan x="1437.5" dy="48">R17 position</tspan>
</text>
<rect x="1940" y="90" width="845" height="1110" rx="28" fill="#F7F4EC" stroke="#B29B6F" stroke-width="4"/>
<text x="2362.5" y="155" class="panelTitle" text-anchor="middle">
<tspan x="2362.5" dy="0">C. Reflow evidence</tspan>
<tspan x="2362.5" dy="48">near R17</tspan>
</text>
<rect x="2865" y="90" width="845" height="1110" rx="28" fill="#F3EFF8" stroke="#8C7BB8" stroke-width="4"/>
<text x="3287.5" y="155" class="panelTitle" text-anchor="middle">
<tspan x="3287.5" dy="0">D. Post-reflow observation</tspan>
<tspan x="3287.5" dy="48">R17 condition</tspan>
</text>
<rect x="175" y="265" width="675" height="100" rx="18" fill="#ffffff" stroke="#8A9AA8" stroke-width="3"/>
<text x="512.5" y="310" class="small" text-anchor="middle" font-weight="700">
<tspan x="512.5" dy="0">Supplied case criterion</tspan>
<tspan x="512.5" dy="38">80-120% of nominal paste volume</tspan>
</text>
<text x="512.5" y="405" class="tiny" text-anchor="middle" fill="#5D6B78">schematic deposits; percentages are SPI volume results</text>
<rect x="265" y="500" width="210" height="120" rx="12" fill="#D6DEE4" stroke="#66757F" stroke-width="4"/>
<rect x="310.0" y="528" width="120" height="64" rx="10" fill="#BCC6CD" stroke="#8A9AA8" stroke-width="3"/>
<text x="370" y="455" class="body" text-anchor="middle">
<tspan x="370" dy="0">Pad A</tspan>
</text>
<text x="370" y="675" class="metric" text-anchor="middle">
<tspan x="370" dy="0">63%</tspan>
<tspan x="370" dy="42">of nominal</tspan>
</text>
<rect x="312.5" y="765" width="115" height="54" rx="14" fill="#B85C3E"/>
<text x="370.0" y="802" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">FAIL</text>
<rect x="550" y="500" width="210" height="120" rx="12" fill="#D6DEE4" stroke="#66757F" stroke-width="4"/>
<rect x="560.0" y="528" width="190" height="64" rx="10" fill="#BCC6CD" stroke="#8A9AA8" stroke-width="3"/>
<text x="655" y="455" class="body" text-anchor="middle">
<tspan x="655" dy="0">Pad B</tspan>
</text>
<text x="655" y="675" class="metric" text-anchor="middle">
<tspan x="655" dy="0">98%</tspan>
<tspan x="655" dy="42">of nominal</tspan>
</text>
<rect x="597.5" y="765" width="115" height="54" rx="14" fill="#4F9362"/>
<text x="655.0" y="802" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">PASS</text>

<text x="512.5" y="1025" class="body" text-anchor="middle" fill="#7B4A2D" font-weight="700">
<tspan x="512.5" dy="0">Strong abnormal evidence:</tspan>
<tspan x="512.5" dy="42">unequal paste deposits</tspan>
</text>
<rect x="1160" y="425" width="555" height="320" rx="18" fill="#DCEFEA" stroke="#4F9362" stroke-width="5"/>
<rect x="1240" y="575" width="180" height="72" rx="8" fill="#D6DEE4" stroke="#66757F" stroke-width="3"/>
