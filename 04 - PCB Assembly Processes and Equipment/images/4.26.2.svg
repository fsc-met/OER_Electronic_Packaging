<rect x="3125" y="555" width="35" height="90" rx="5" fill="#D8DADD" stroke="#8A9AA8" stroke-width="3"/>
<rect x="3440" y="555" width="35" height="90" rx="5" fill="#D8DADD" stroke="#8A9AA8" stroke-width="3"/>
</g>
<path d="M 3100 725 Q 3140 655 3185 725" fill="#C0C7CB" stroke="#707B82" stroke-width="3"/>
<line x1="3485" y1="460" x2="3420" y2="530" stroke="#B85C3E" stroke-width="6" marker-end="url(#arrowAmber)"/>
<text x="3287.5" y="330" class="metric" text-anchor="middle" fill="#7B3E2D">
<tspan x="3287.5" dy="0">R17 tombstoned</tspan>
</text>
<text x="3287.5" y="390" class="small" text-anchor="middle" fill="#5D6B78">
<tspan x="3287.5" dy="0">post-reflow AOI observation</tspan>
</text>
<text x="3287.5" y="940" class="body" text-anchor="middle" font-weight="700">
<tspan x="3287.5" dy="0">One end lifted after reflow</tspan>
</text>
<text x="3287.5" y="1020" class="small" text-anchor="middle" fill="#5D6B78">
<tspan x="3287.5" dy="0">Defect observation only;</tspan>
<tspan x="3287.5" dy="40">not an automatic reflow diagnosis.</tspan>
</text>
<line x1="935" y1="645" x2="1015" y2="645" stroke="#3F6179" stroke-width="7" marker-end="url(#arrowBlue)"/>
<line x1="1860" y1="645" x2="1940" y2="645" stroke="#3F6179" stroke-width="7" marker-end="url(#arrowBlue)"/>
<line x1="2785" y1="645" x2="2865" y2="645" stroke="#3F6179" stroke-width="7" marker-end="url(#arrowBlue)"/>
<rect x="180" y="1290" width="3440" height="630" rx="30" fill="#EEF6F7" stroke="#3D7B82" stroke-width="5"/>
<text x="1900" y="1365" class="conclusion" text-anchor="middle" fill="#245A60">
<tspan x="1900" dy="0">Best-supported next investigation</tspan>
</text>
<text x="1900" y="1435" class="conclusion" text-anchor="middle" fill="#245A60">
<tspan x="1900" dy="0">PRINT PROCESS</tspan>
</text>
<text x="1900" y="1505" class="body" text-anchor="middle" fill="#4D6265">
<tspan x="1900" dy="0">Unequal paste is the strongest abnormal upstream clue in the supplied case.</tspan>
</text>
<rect x="280" y="1585" width="700" height="130" rx="18" fill="#ffffff" stroke="#7FA9AD" stroke-width="3"/>
<text x="630" y="1632" class="body" text-anchor="middle" font-weight="700">
<tspan x="630" dy="0">R17 stencil apertures</tspan>
</text>

<rect x="1100" y="1585" width="700" height="130" rx="18" fill="#ffffff" stroke="#7FA9AD" stroke-width="3"/>
<text x="1450" y="1632" class="body" text-anchor="middle" font-weight="700">
<tspan x="1450" dy="0">Paste release / clogging</tspan>
</text>

<rect x="1920" y="1585" width="700" height="130" rx="18" fill="#ffffff" stroke="#7FA9AD" stroke-width="3"/>
<text x="2270" y="1632" class="body" text-anchor="middle" font-weight="700">
<tspan x="2270" dy="0">Stencil underside / gasketing</tspan>
</text>

<rect x="2740" y="1585" width="700" height="130" rx="18" fill="#ffffff" stroke="#7FA9AD" stroke-width="3"/>
<text x="3090" y="1632" class="body" text-anchor="middle" font-weight="700">
<tspan x="3090" dy="0">Print alignment / local support</tspan>
</text>

<rect x="420" y="1765" width="1770" height="100" rx="18" fill="#FFF7EA" stroke="#C9821A" stroke-width="3"/>
<text x="1305" y="1828" class="body" text-anchor="middle" fill="#8B5D20" font-weight="700">
<tspan x="1305" dy="0">Strongest clue ≠ proven root cause — verify before concluding.</tspan>
</text>
<rect x="2325" y="1765" width="1050" height="100" rx="18" fill="#F7F8FA" stroke="#8A9AA8" stroke-width="3"/>
<text x="2850" y="1828" class="body" text-anchor="middle" fill="#5D6B78" font-weight="700">
<tspan x="2850" dy="0">Do not change the oven first from this evidence.</tspan>
</text>
