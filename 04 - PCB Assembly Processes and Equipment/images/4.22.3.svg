</defs><rect x="100" y="90" width="1340" height="1320" rx="30" fill="#eef6fb" stroke="#74a9cf" stroke-width="5"/><rect x="1560" y="90" width="1340" height="1320" rx="30" fill="#fbf5ea" stroke="#d8b46f" stroke-width="5"/><text x="155" y="185" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#23364d"><tspan x="155" dy="0">Underfill beneath an area-array package</tspan></text><text x="1615" y="185" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#23364d"><tspan x="1615" dy="0">Potting / encapsulation around a PCBA</tspan></text><text x="170" y="335" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="start" fill="#23364d"><tspan x="170" dy="0">Representative capillary-underfill process</tspan></text><text x="170" y="400" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan x="170" dy="0">Solder joints are formed before underfill is dispensed.</tspan></text><rect x="280" y="880" width="980" height="95" rx="10" fill="#3a9d5d" stroke="#1f5d3f" stroke-width="5"/><rect x="470" y="510" width="600" height="235" rx="22" fill="#4b5563" stroke="#28313a" stroke-width="5"/><text x="770.0" y="645" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff"><tspan x="770.0" dy="0">Area-array package</tspan></text><circle cx="525" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="595" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="665" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="735" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="805" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="875" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="945" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><circle cx="1015" cy="825" r="29" fill="#c8d0d9" stroke="#66727e" stroke-width="4"/><rect x="480" y="757" width="580" height="115" rx="18" fill="#7fb9d7" fill-opacity="0.58" stroke="#4d8faf" stroke-width="4"/><path d="M 455 797 C 365 752, 360 857, 455 852 Z" fill="#7fb9d7" fill-opacity="0.72" stroke="#4d8faf" stroke-width="4"/><line x1="495" y1="785" x2="890" y2="785" stroke="#2f73c8" stroke-width="7" marker-end="url(#arrowBlue)"/><line x1="495" y1="825" x2="890" y2="825" stroke="#2f73c8" stroke-width="7" marker-end="url(#arrowBlue)"/><text x="175" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan x="175" dy="0">Underfill dispense</tspan></text><line x1="415" y1="1025" x2="433" y2="812" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><text x="1140" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937"><tspan x="1140" dy="0">Solder</tspan><tspan x="1140" dy="43">interconnections</tspan></text><line x1="1090" y1="995" x2="995" y2="830" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><text x="1180" y="650" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937"><tspan x="1180" dy="0">Package-to-board</tspan><tspan x="1180" dy="43">gap</tspan></text><line x1="1130" y1="705" x2="1055" y2="792" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><text x="710" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#2f73c8"><tspan x="710" dy="0">Capillary flow (representative)</tspan></text><text x="710" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="normal" text-anchor="middle" fill="#1f2937"><tspan x="710" dy="0">Cured underfill stays localized beneath the package.</tspan></text><text x="710" y="1272" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="normal" text-anchor="middle" fill="#1f2937"><tspan x="710" dy="0">Most of the board remains exposed and accessible.</tspan></text><rect x="410" y="1325" width="780" height="110" rx="22" fill="#ffffff" stroke="#79a6bf" stroke-width="4"/><text x="800.0" y="1395" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="#23364d"><tspan x="800.0" dy="0">Localized reinforcement</tspan></text><text x="1630" y="320" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" text-anchor="start" fill="#23364d"><tspan x="1630" dy="0">Broad-volume protection around part or all</tspan><tspan x="1630" dy="54">of the assembly</tspan></text><text x="1630" y="450" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan x="1630" dy="0">The polymer volume is much larger than underfill.</tspan></text><rect x="1785" y="520" width="900" height="565" rx="18" fill="none" stroke="#9aa4af" stroke-width="30"/><rect x="1875" y="910" width="720" height="90" rx="8" fill="#3a9d5d" stroke="#1f5d3f" stroke-width="5"/><rect x="1965" y="760" width="150" height="150" rx="16" fill="#4b5563" stroke="#28313a" stroke-width="5"/><rect x="2195" y="690" width="210" height="220" rx="16" fill="#4b5563" stroke="#28313a" stroke-width="5"/><rect x="2465" y="780" width="115" height="130" rx="16" fill="#4b5563" stroke="#28313a" stroke-width="5"/><rect x="1813" y="690" width="844" height="365" rx="10" fill="#c7a46a" fill-opacity="0.38" stroke="#b68a49" stroke-width="4"/><text x="1655" y="590" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan x="1655" dy="0">Housing / mold</tspan></text><line x1="1880" y1="575" x2="1807" y2="590" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><text x="2600" y="610" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937"><tspan x="2600" dy="0">Potting / encapsulation</tspan><tspan x="2600" dy="43">material</tspan></text><line x1="2600" y1="665" x2="2435" y2="765" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><text x="1810" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#1f2937"><tspan x="1810" dy="0">PCBA</tspan></text><line x1="1810" y1="1135" x2="2045" y2="945" stroke="#23364d" stroke-width="4" marker-end="url(#arrowGray)"/><rect x="2340" y="1125" width="520" height="175" rx="20" fill="#fffafa" stroke="#d68a8a" stroke-width="4"/><text x="2600.0" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#c94b4b"><tspan x="2600.0" dy="0">Direct component access</tspan></text><text x="2600.0" y="1247" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#1f2937"><tspan x="2600.0" dy="0">greatly reduced after cure</tspan></text><line x1="2380" y1="1125" x2="2225" y2="720" stroke="#c94b4b" stroke-width="7" stroke-dasharray="20 14" marker-end="url(#arrowRed)"/><line x1="2201" y1="696" x2="2249" y2="744" stroke="#c94b4b" stroke-width="9"/><line x1="2249" y1="696" x2="2201" y2="744" stroke="#c94b4b" stroke-width="9"/><rect x="1850" y="1325" width="650" height="110" rx="22" fill="#ffffff" stroke="#c7a46a" stroke-width="4"/><text x="2175.0" y="1395" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="#23364d"><tspan x="2175.0" dy="0">Broad-volume protection</tspan></text><rect x="100" y="1450" width="2800" height="310" rx="28" fill="#f5f7fa" stroke="#b9c2cc" stroke-width="5"/><line x1="1500" y1="1475" x2="1500" y2="1715" stroke="#c8d0d8" stroke-width="4"/><text x="780" y="1532" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#23364d"><tspan x="780" dy="0">Underfill: localized reinforcement</tspan></text><text x="780" y="1595" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="normal" text-anchor="middle" fill="#1f2937"><tspan x="780" dy="0">Most of the board remains exposed.</tspan></text><text x="2220" y="1532" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#23364d"><tspan x="2220" dy="0">Potting / encapsulation: broad coverage</tspan></text><text x="2220" y="1595" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="normal" text-anchor="middle" fill="#1f2937"><tspan x="2220" dy="0">Direct component access is greatly reduced.</tspan></text><text x="1500" y="1675" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#4b5563"><tspan x="1500" dy="0">Protection strategy is product specific; more coverage can mean less direct access</tspan><tspan x="1500" dy="44">for service or rework.</tspan></text></svg>