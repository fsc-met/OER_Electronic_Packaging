[book]
title = "Electronic Packaging Applications: An Applied Introduction"
description = "An applied introduction to electronic packaging for engineering technology students."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.katex]
after = ["links"]

[output.html]
no-section-label = true
site-url = "/epac/"

additional-css = [
    "theme/openengineeringbooks.css",
    "theme/instructor-access.css"
]

additional-js = [
    "theme/openengineeringbooks.js",
    "theme/instructor-access.js"
]

default-theme = "light"
preferred-dark-theme = "light"
sidebar-header-nav = false

[output.html.fold]
enable = true
level = 0
