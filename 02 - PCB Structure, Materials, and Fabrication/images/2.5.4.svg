<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#24313a"/>
    </marker>
    <marker id="arrowHeat" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b7432f"/>
    </marker>
    <marker id="arrowHeatSmall" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b7432f"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#1f2933; font-size:30px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill:#1f2933; font-size:25px; }
      .panel { font-family: Arial, Helvetica, sans-serif; fill:#1f2933; font-size:38px; font-weight:700; }
      .compare { font-family: Arial, Helvetica, sans-serif; fill:#1f2933; font-size:24px; font-weight:600; }
      .leader { stroke:#24313a; stroke-width:4; fill:none; marker-end:url(#arrowDark); }
      .heat { stroke:#b7432f; stroke-width:8; fill:none; marker-end:url(#arrowHeat); stroke-linecap:round; }
      .heatRestricted { stroke:#b7432f; stroke-width:5; fill:none; marker-end:url(#arrowHeatSmall); stroke-linecap:round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1000" fill="#ffffff"/>
  <line x1="900" y1="70" x2="900" y2="905" stroke="#8a9399" stroke-width="3" stroke-dasharray="12 12"/>

  <text x="450" y="75" class="panel" text-anchor="middle">Solid connection</text>
  <text x="1350" y="75" class="panel" text-anchor="middle">Thermal-relief connection</text>

  <!-- LEFT PANEL: SOLID CONNECTION -->
  <rect x="150" y="170" width="600" height="520" rx="8" fill="#d89a3a" stroke="#5b4b2b" stroke-width="4"/>
  <!-- conceptual pad boundary; copper remains fully continuous -->
  <circle cx="450" cy="430" r="112" fill="#d89a3a" stroke="#5b4b2b" stroke-width="4"/>
  <circle cx="450" cy="430" r="69" fill="#b9792f" stroke="#5b4b2b" stroke-width="4"/>
  <circle cx="450" cy="430" r="51" fill="#ffffff" stroke="#5b4b2b" stroke-width="4"/>

  <!-- more direct conceptual heat spreading -->
  <line x1="450" y1="315" x2="450" y2="220" class="heat"/>
  <line x1="535" y1="345" x2="620" y2="270" class="heat"/>
  <line x1="565" y1="430" x2="690" y2="430" class="heat"/>
  <line x1="535" y1="515" x2="620" y2="595" class="heat"/>
  <line x1="450" y1="545" x2="450" y2="645" class="heat"/>
  <line x1="365" y1="515" x2="280" y2="595" class="heat"/>
  <line x1="335" y1="430" x2="210" y2="430" class="heat"/>
  <line x1="365" y1="345" x2="280" y2="270" class="heat"/>

  <text x="112" y="155" class="label">Copper plane / pour</text>
  <path d="M255,160 L285,200" class="leader"/>
  <text x="585" y="355" class="label">Plated hole</text>
  <path d="M580,365 L500,405" class="leader"/>
  <text x="450" y="735" class="small" text-anchor="middle">More direct heat spreading into the plane during soldering</text>

  <!-- RIGHT PANEL: THERMAL RELIEF -->
  <rect x="1050" y="170" width="600" height="520" rx="8" fill="#d89a3a" stroke="#5b4b2b" stroke-width="4"/>
  <circle cx="1350" cy="430" r="142" fill="#cfe3d2" stroke="#5b4b2b" stroke-width="3"/>

  <!-- four copper spokes -->
  <rect x="1324" y="288" width="52" height="90" fill="#d89a3a"/>
  <rect x="1324" y="482" width="52" height="90" fill="#d89a3a"/>
  <rect x="1208" y="404" width="90" height="52" fill="#d89a3a"/>
  <rect x="1402" y="404" width="90" height="52" fill="#d89a3a"/>

  <circle cx="1350" cy="430" r="92" fill="#d89a3a" stroke="#5b4b2b" stroke-width="4"/>
  <circle cx="1350" cy="430" r="69" fill="#b9792f" stroke="#5b4b2b" stroke-width="4"/>
  <circle cx="1350" cy="430" r="51" fill="#ffffff" stroke="#5b4b2b" stroke-width="4"/>

  <!-- fewer / narrower conceptual heat arrows, all constrained to copper spokes -->
  <line x1="1350" y1="338" x2="1350" y2="246" class="heatRestricted"/>
  <line x1="1442" y1="430" x2="1534" y2="430" class="heatRestricted"/>
  <line x1="1350" y1="522" x2="1350" y2="614" class="heatRestricted"/>

  <text x="1015" y="155" class="label">Copper plane / pour</text>
  <path d="M1165,160 L1195,205" class="leader"/>
  <text x="1510" y="340" class="label">Plated hole</text>
  <path d="M1505,350 L1400,405" class="leader"/>
  <text x="1485" y="585" class="label">Copper spokes</text>
  <path d="M1475,575 L1380,520" class="leader"/>
  <text x="1015" y="575" class="label">Clearance gaps</text>
  <path d="M1195,565 L1250,510" class="leader"/>
  <text x="1350" y="735" class="small" text-anchor="middle">Heat flow is restricted to the copper spokes during soldering</text>

  <!-- concise comparison -->
  <rect x="120" y="790" width="660" height="92" rx="14" fill="#f5f7f8" stroke="#c7d0d6" stroke-width="3"/>
  <text x="450" y="826" class="compare" text-anchor="middle">Solid connection</text>
  <text x="450" y="860" class="small" text-anchor="middle">Lower electrical and thermal resistance to plane</text>

  <rect x="1020" y="790" width="660" height="92" rx="14" fill="#f5f7f8" stroke="#c7d0d6" stroke-width="3"/>
  <text x="1350" y="826" class="compare" text-anchor="middle">Thermal relief</text>
  <text x="1350" y="860" class="small" text-anchor="middle">Easier localized heating during soldering</text>

  <text x="900" y="930" class="small" text-anchor="middle">Both remain electrically connected to the plane; a thermal relief is not a thermal via.</text>
</svg>
